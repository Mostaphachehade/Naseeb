name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Ephemeral, disposable — never the real Neon database. No production
    # credentials are ever given to CI.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: naseeb
          POSTGRES_PASSWORD: naseeb
          POSTGRES_DB: naseeb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # TEST_DATABASE_URL rather than DATABASE_URL: the suite's guard reads this
      # one by name, so CI exercises the same path a developer's machine does
      # instead of a special case. The database name contains "test" and the
      # host is local, which is what the guard in testEnv.js requires.
      TEST_DATABASE_URL: postgresql://naseeb:naseeb@localhost:5432/naseeb_test
      DATABASE_SSL: 'false'
      APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm test` now resets the schema itself (scripts/reset-test-db.js) as a
      # single sequential step before `node --test` runs the files in parallel,
      # so the separate db:init step this job used to need is gone. That
      # ordering still matters: two test files both running CREATE TABLE IF NOT
      # EXISTS against a brand-new database at the same instant is not safe in
      # Postgres — the second writer loses with a duplicate-key error on
      # pg_type.
      - run: npm test
