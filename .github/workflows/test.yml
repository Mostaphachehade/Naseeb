name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Ephemeral, disposable — never the real Neon database. No production
    # credentials are ever given to CI.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: naseeb
          POSTGRES_PASSWORD: naseeb
          POSTGRES_DB: naseeb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # TEST_DATABASE_URL rather than DATABASE_URL: the suite's guard reads this
      # one by name, so CI exercises the same path a developer's machine does
      # instead of a special case. The database name contains "test" and the
      # host is local, which is what the guard in testEnv.js requires.
      TEST_DATABASE_URL: postgresql://naseeb:naseeb@localhost:5432/naseeb_test
      DATABASE_SSL: 'false'
      APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Deterministic install, asserted rather than assumed: `npm ci` fails if
      # package.json and the lockfile disagree, so a drifted lockfile is a build
      # failure here rather than a surprise in production.
      - name: Lockfile is authoritative
        run: |
          git diff --exit-code package-lock.json || {
            echo "::error::npm ci modified the lockfile. package.json and package-lock.json disagree."
            exit 1
          }

      # `npm test` now resets the schema itself (scripts/reset-test-db.js) as a
      # single sequential step before `node --test` runs the files in parallel,
      # so the separate db:init step this job used to need is gone. That
      # ordering still matters: two test files both running CREATE TABLE IF NOT
      # EXISTS against a brand-new database at the same instant is not safe in
      # Postgres — the second writer loses with a duplicate-key error on
      # pg_type.
      - run: npm test

  # The hostile-data browser run, as a required job of its own.
  #
  # It is separate from `test` because it needs a browser and takes minutes, and
  # required because a security check that only runs when somebody remembers is
  # not a check. It fails the build on a payload execution, an unexpected
  # network request, a CSP violation or a JavaScript error.
  browser-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: naseeb
          POSTGRES_PASSWORD: naseeb
          POSTGRES_DB: naseeb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The same guarded variable the local suite uses, so CI cannot reach a
      # real database by construction. No production .env is ever present.
      TEST_DATABASE_URL: postgresql://naseeb:naseeb@localhost:5432/naseeb_test
      DATABASE_SSL: 'false'
      APP_URL: http://localhost:3000
      # Chromium is pinned to a published Playwright release rather than
      # "whatever is current", so a browser change cannot silently alter what
      # this job proves.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Pinned version. Update it deliberately, in a commit that says so.
      - name: Install pinned Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Prepare the isolated schema
        run: node scripts/reset-test-db.js

      # Proves the detector still reports red before the real run is trusted
      # when it reports green. Inverted on purpose: this step FAILS if the
      # injected payload is not caught.
      - name: Self-test — the harness must fail on a real injection
        run: |
          if HOSTILE_SELFTEST=1 npm run test:browser-security; then
            echo "::error::The hostile-data harness passed while live markup was injected. The detector is broken."
            exit 1
          fi
          echo "Self-test behaved correctly: the injected payload was caught."

      - name: Hostile-data browser run
        run: npm run test:browser-security

      # Only on failure, and only the harness's own report — which by
      # construction contains no session cookie, CSRF token, claim token or
      # delivery detail, because it never prints them. Fabricated data only.
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-security-report
          path: .browser-security/
          retention-days: 7
          if-no-files-found: ignore

  # Operational verification: the maintenance jobs and a real backup/restore.
  #
  # Separate from `test` because it needs the PostgreSQL client tools and runs
  # commands rather than a test runner. Required, because a maintenance job that
  # is never executed is a maintenance job nobody knows is broken, and a backup
  # is not proven until a restore succeeds.
  operations:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: naseeb
          POSTGRES_PASSWORD: naseeb
          POSTGRES_DB: naseeb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://naseeb:naseeb@localhost:5432/naseeb_test
      DATABASE_SSL: 'false'
      APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # pg_dump/pg_restore must match the server major version, so the client
      # comes from the PostgreSQL apt repository rather than whatever the runner
      # image happens to ship.
      - name: Install PostgreSQL 16 client
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          sudo sed -i 's|deb http|deb [signed-by=/usr/share/keyrings/pgdg.gpg] http|' /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Prepare the isolated schema
        run: node scripts/reset-test-db.js

      # Run every job twice. The second run proves idempotence: the same
      # commands against the same database must succeed and change nothing.
      - name: Maintenance jobs run, and run again
        env:
          DATABASE_URL: postgresql://naseeb:naseeb@localhost:5432/naseeb_test
          SESSION_SECRET: ci-only-fabricated-secret-value-0123456789abcdef
        run: |
          node scripts/maintenance.js --list
          node scripts/maintenance.js all
          node scripts/maintenance.js all
          node scripts/maintenance.js sessions risk_signals

      # Backup and restore, against fabricated data in the isolated database.
      # Proves the MECHANISM. It says nothing about the provider's backups,
      # which only the owner can confirm — see docs/OPERATIONS.md.
      - name: Backup and restore verification
        run: npm run backup:verify

  # The joined-up giveaway rehearsal.
  #
  # Separate from `test` because it is a single narrative run rather than a
  # suite, and its value is the ORDER: proposal, approval, publication, a
  # hundred entries, closure, the draw, the queued notification, cancellation.
  # A green unit suite can still describe a journey nobody has walked.
  #
  # It refuses to start against anything that is not an isolated test database —
  # twice, through two independent guards. See scripts/rehearsal-giveaway.js.
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: naseeb
          POSTGRES_PASSWORD: naseeb
          POSTGRES_DB: naseeb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://naseeb:naseeb@localhost:5432/naseeb_test
      DATABASE_SSL: 'false'
      APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prepare the isolated schema
        run: node scripts/reset-test-db.js

      # Proves the guard refuses a production-shaped target before it refuses
      # anything else. Inverted on purpose: this step FAILS if the rehearsal is
      # willing to run against a database called neondb on a Neon host.
      - name: Guard self-test — the rehearsal must refuse production
        run: |
          if TEST_DATABASE_URL='postgresql://u:p@ep-fake.us-east-1.aws.neon.tech/neondb' \
             ALLOW_REMOTE_TEST_DB=yes npm run rehearse:giveaway; then
            echo "::error::The rehearsal accepted a production-shaped database. The guard is broken."
            exit 1
          fi
          echo "Guard behaved correctly: the production-shaped target was refused."

      - name: Giveaway rehearsal
        run: npm run rehearse:giveaway

      - name: Upload rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: giveaway-rehearsal
          path: .rehearsal/
          retention-days: 7
          if-no-files-found: ignore

  # Accessibility sweep: axe-core over all 23 pages, desktop and mobile.
  #
  # A green run here is a FLOOR, not a conformance claim — axe-core covers a
  # minority of WCAG criteria, and the manual keyboard and screen-reader checks
  # that cover the rest live in docs/ACCESSIBILITY.md along with what could not
  # be verified.
  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: naseeb
          POSTGRES_PASSWORD: naseeb
          POSTGRES_DB: naseeb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://naseeb:naseeb@localhost:5432/naseeb_test
      DATABASE_SSL: 'false'
      APP_URL: http://localhost:3000
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Same pinned Chromium the hostile-data job uses.
      - name: Install pinned Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Prepare the isolated schema
        run: node scripts/reset-test-db.js

      - name: Accessibility sweep
        run: npm run test:accessibility

      - name: Upload axe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: .accessibility/
          retention-days: 7
          if-no-files-found: ignore
