services:
  - type: web
    name: naseeb
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_NOTIFY_EMAIL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_UPLOAD_PRESET
        sync: false
      # Self-serve ad checkout. Pinned to false here rather than left to the
      # dashboard so a redeploy can't silently inherit a stale "true" — the
      # value has to be changed deliberately, in this file, to turn payment on.
      - key: ADS_CHECKOUT_ENABLED
        value: false
      # Required whenever ADS_CHECKOUT_ENABLED is true; the app refuses to boot
      # without them. sync: false keeps both out of this file and out of git —
      # set them in the Render dashboard. STRIPE_WEBHOOK_SECRET is the signing
      # secret for the /api/webhooks/stripe endpoint, not the API key, and is
      # different for every environment.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Winner delivery details are encrypted with this. The app refuses to
      # start in production without it while claims are enabled. sync: false
      # keeps it out of this file and out of git — set it in the dashboard, and
      # back it up separately: losing it makes stored delivery details
      # permanently unreadable.
      - key: CLAIM_ENCRYPTION_KEY
        sync: false
      - key: CLAIM_ENCRYPTION_KEYS_PREVIOUS
        sync: false
      - key: CLAIM_TOKEN_TTL_HOURS
        sync: false
      - key: CLAIM_DELIVERY_RETENTION_DAYS
        sync: false
      - key: GA_MEASUREMENT_ID
        sync: false
      - key: SENTRY_DSN
        sync: false
