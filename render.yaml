services:
  - type: web
    name: naseeb
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_NOTIFY_EMAIL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_UPLOAD_PRESET
        sync: false
      # Self-serve ad checkout. Pinned to false here rather than left to the
      # dashboard so a redeploy can't silently inherit a stale "true" — the
      # value has to be changed deliberately, in this file, to turn payment on.
      - key: ADS_CHECKOUT_ENABLED
        value: false
      - key: GA_MEASUREMENT_ID
        sync: false
      - key: SENTRY_DSN
        sync: false
