<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset your password — Naseeb</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0B3B36" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>

<header class="site">
  <div class="wrap">
    <a href="/index.html" class="brand">Naseeb<span class="dot">.</span></a>
    <nav class="site-nav" id="site-nav"></nav>
  </div>
</header>

<main id="main">
  <div class="wrap" style="max-width:560px;">
    <div class="section-head"><div><h2>Reset your password</h2><p>We'll email you a link to set a new one.</p></div></div>
    <form class="card narrow" id="forgot-form">
      <label for="email">Email</label>
      <input id="email" type="email" required />

      <button class="btn primary" type="submit">Send reset link</button>
      <p class="form-error" id="error"></p>
      <p class="form-success" id="success"></p>
    </form>
    <p style="text-align:center; margin-top:18px; color:var(--text-soft);"><a href="/login.html" style="font-weight:600;">Back to sign in</a></p>
  </div>
</main>

<div id="site-footer"></div>

<script src="/js/app.js"></script>
<script>
  document.getElementById('forgot-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('error');
    const successEl = document.getElementById('success');
    errorEl.classList.remove('show');
    successEl.classList.remove('show');
    const btn = e.target.querySelector('button');
    btn.disabled = true;
    try {
      const { message } = await api('/auth/forgot-password', {
        method: 'POST',
        body: JSON.stringify({ email: document.getElementById('email').value }),
      });
      successEl.textContent = message;
      successEl.classList.add('show');
      e.target.reset();
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.classList.add('show');
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
