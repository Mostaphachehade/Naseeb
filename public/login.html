<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — Naseeb</title>
<meta name="description" content="Sign in to Naseeb to enter and host free giveaways." />
<meta name="theme-color" content="#0B3B36" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/utilities.css" />
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>

<header class="site">
  <div class="wrap">
    <a href="/index.html" class="brand">Naseeb<span class="dot">.</span></a>
    <nav class="site-nav" id="site-nav"></nav>
  </div>
</header>

<main id="main">
  <div class="wrap u-29cd8c40">
    <div class="section-head"><div><h2>Sign in</h2><p>Welcome back.</p></div></div>
    <form class="card narrow" id="login-form">
      <label for="email">Email</label>
      <input id="email" type="email" required />

      <label for="password">Password</label>
      <input id="password" type="password" required />
      <p class="hint"><a href="/forgot-password.html" class="u-b1c3aa06">Forgot your password?</a></p>

      <button class="btn primary" type="submit">Sign in</button>
      <p class="form-error" id="error"></p>
    </form>
    <p class="u-11d6131e">New here? <a id="signup-link" href="/signup.html" class="u-0b87e9e0">Join free</a></p>
  </div>
</main>

<div id="site-footer"></div>

<script src="/js/dom.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/app.js"></script>
<script src="/js/pages/login.js"></script>
</body>
</html>
