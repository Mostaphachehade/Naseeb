<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title data-i18n="resetpassword.setANewPassword">Set a new password — Naseeb</title>
<meta name="description" data-i18n-content="resetpassword.metaDescription" content="Set a new password for your Naseeb account." />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0B3B36" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/utilities.css" />
</head>
<body>
<a href="#main" class="skip-link" data-i18n="common.skipToContent">Skip to content</a>

<header class="site">
  <div class="wrap">
    <a href="/index.html" class="brand">Naseeb<span class="dot">.</span></a>
    <nav class="site-nav" id="site-nav"></nav>
  </div>
</header>

<main id="main">
  <div class="wrap u-29cd8c40">
    <div class="section-head"><div><h2 data-i18n="resetpassword.setANewPassword2">Set a new password</h2><p data-i18n="resetpassword.makeItSomethingYou">Make it something you haven't used elsewhere.</p></div></div>
    <form class="card narrow" id="reset-form">
      <label for="password" data-i18n="resetpassword.newPassword">New password</label>
      <input id="password" type="password" minlength="8" required />
      <p class="hint" data-i18n="common.min8">At least 8 characters.</p>

      <button class="btn primary" type="submit" data-i18n="resetpassword.setNewPassword">Set new password</button>
      <p class="form-error" id="error"></p>
    </form>
    <div class="card narrow u-287a5cfe is-hidden" id="success-card">
      <h2 data-i18n="resetpassword.passwordUpdated">Password updated.</h2>
      <p class="u-a2aae0fb" data-i18n="resetpassword.youCanSignIn">You can sign in with your new password now.</p>
      <a href="/login.html" class="btn primary u-8a359a76" data-i18n="nav.signIn">Sign in</a>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="/js/dom.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/i18n/errors.js"></script>
<script src="/js/i18n/auth.js"></script>
<script src="/js/app.js"></script>
<script src="/js/pages/reset-password.js"></script>
</body>
</html>
