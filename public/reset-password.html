<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Set a new password — Naseeb</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0B3B36" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>

<header class="site">
  <div class="wrap">
    <a href="/index.html" class="brand">Naseeb<span class="dot">.</span></a>
    <nav class="site-nav" id="site-nav"></nav>
  </div>
</header>

<main id="main">
  <div class="wrap" style="max-width:560px;">
    <div class="section-head"><div><h2>Set a new password</h2><p>Make it something you haven't used elsewhere.</p></div></div>
    <form class="card narrow" id="reset-form">
      <label for="password">New password</label>
      <input id="password" type="password" minlength="8" required />
      <p class="hint">At least 8 characters.</p>

      <button class="btn primary" type="submit">Set new password</button>
      <p class="form-error" id="error"></p>
    </form>
    <div class="card narrow" id="success-card" style="display:none; text-align:center;">
      <h2>Password updated.</h2>
      <p style="color:var(--text-soft);">You can sign in with your new password now.</p>
      <a href="/login.html" class="btn primary" style="margin-top:16px;">Sign in</a>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="/js/i18n.js"></script>
<script src="/js/app.js"></script>
<script>
  const token = new URLSearchParams(window.location.search).get('token');
  if (!token) {
    document.getElementById('error').textContent = 'This reset link is missing its token. Request a new one from the sign-in page.';
    document.getElementById('error').classList.add('show');
    document.getElementById('reset-form').querySelector('button').disabled = true;
  }

  document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('error');
    errorEl.classList.remove('show');
    try {
      await api('/auth/reset-password', {
        method: 'POST',
        body: JSON.stringify({ token, password: document.getElementById('password').value }),
      });
      document.getElementById('reset-form').style.display = 'none';
      document.getElementById('success-card').style.display = 'block';
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.classList.add('show');
    }
  });
</script>
</body>
</html>
