<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verify your email — Naseeb</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0B3B36" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>

<header class="site">
  <div class="wrap">
    <a href="/index.html" class="brand">Naseeb<span class="dot">.</span></a>
    <nav class="site-nav" id="site-nav"></nav>
  </div>
</header>

<main id="main">
  <div class="wrap" style="max-width:560px;">
    <div class="card narrow" style="text-align:center;" id="content">
      <p>Verifying…</p>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="/js/app.js"></script>
<script>
  async function run() {
    const content = document.getElementById('content');
    const token = new URLSearchParams(window.location.search).get('token');
    if (!token) {
      content.innerHTML = `<h2>Missing link</h2><p style="color:var(--text-soft);">This verification link is missing its token. Use the link from your email, or request a new one from your dashboard.</p>`;
      return;
    }
    try {
      const res = await fetch(`/api/auth/verify?token=${encodeURIComponent(token)}`);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Something went wrong. Please try again.');

      const user = getUser();
      if (user) {
        user.email_verified = true;
        setSession(getToken(), user);
      }

      content.innerHTML = `
        <h2>You're verified.</h2>
        <p style="color:var(--text-soft);">${data.message}</p>
        <a href="/index.html" class="btn primary" style="margin-top:16px;">Continue to Naseeb</a>
      `;
    } catch (err) {
      content.innerHTML = `<h2>Couldn't verify</h2><p style="color:var(--text-soft);">${err.message}</p>`;
    }
  }
  run();
</script>
</body>
</html>
