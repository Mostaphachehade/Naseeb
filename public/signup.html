<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title data-i18n="signup.joinNaseeb">Join Naseeb</title>
<meta name="description" content="Join Naseeb free — enter giveaways with no purchase necessary, ever." />
<meta property="og:title" content="Join Naseeb" />
<meta property="og:description" content="Takes a minute. No payment details, ever." />
<meta property="og:type" content="website" />
<meta name="theme-color" content="#0B3B36" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/utilities.css" />
</head>
<body>
<a href="#main" class="skip-link" data-i18n="common.skipToContent">Skip to content</a>

<header class="site">
  <div class="wrap">
    <a href="/index.html" class="brand">Naseeb<span class="dot">.</span></a>
    <nav class="site-nav" id="site-nav"></nav>
  </div>
</header>

<main id="main">
  <div class="wrap u-29cd8c40">
    <div class="section-head"><div><h2 data-i18n="nav.joinFree">Join free</h2><p data-i18n="signup.takesAMinuteNo">Takes a minute. No payment details, ever.</p></div></div>
    <form class="card narrow" id="signup-form">
      <label for="name" data-i18n="common.fullName">Full name</label>
      <input id="name" required />

      <label for="email" data-i18n="common.email">Email</label>
      <input id="email" type="email" required />

      <label for="password" data-i18n="common.password">Password</label>
      <input id="password" type="password" minlength="8" required />
      <p class="hint" data-i18n="common.min8">At least 8 characters.</p>

      <!-- Not pre-ticked, and required. A self-declaration: no date of birth is
           asked for and no document is collected. Wording is pending counsel
           review — see docs/PRIVACY_AND_RIGHTS.md. -->
      <label class="u-age-attest" for="age_confirmed">
        <input id="age_confirmed" type="checkbox" required />
        <span data-i18n="signup.iConfirmThatI">I confirm that I am 18 years of age or older.</span>
      </label>
      <p class="hint" data-i18n="signup.thisIsYourOwn">This is your own declaration. We do not ask for your date of birth or any identity document, and we cannot verify it.</p>

      <button class="btn primary" type="submit" data-i18n="signup.createAccount">Create account</button>
      <p class="form-error" id="error"></p>
    </form>
    <p class="u-11d6131e"><span data-i18n="auth.alreadyHaveAnAccount">Already have an account?</span> <a id="login-link" href="/login.html" class="u-0b87e9e0" data-i18n="nav.signIn">Sign in</a></p>
  </div>
</main>

<div id="site-footer"></div>

<script src="/js/dom.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/i18n/auth.js"></script>
<script src="/js/app.js"></script>
<script src="/js/pages/signup.js"></script>
</body>
</html>
