<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Join Naseeb</title>
<meta name="description" content="Join Naseeb free — enter giveaways with no purchase necessary, ever." />
<meta property="og:title" content="Join Naseeb" />
<meta property="og:description" content="Takes a minute. No payment details, ever." />
<meta property="og:type" content="website" />
<meta name="theme-color" content="#0B3B36" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/utilities.css" />
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>

<header class="site">
  <div class="wrap">
    <a href="/index.html" class="brand">Naseeb<span class="dot">.</span></a>
    <nav class="site-nav" id="site-nav"></nav>
  </div>
</header>

<main id="main">
  <div class="wrap u-29cd8c40">
    <div class="section-head"><div><h2>Join free</h2><p>Takes a minute. No payment details, ever.</p></div></div>
    <form class="card narrow" id="signup-form">
      <label for="name">Full name</label>
      <input id="name" required />

      <label for="email">Email</label>
      <input id="email" type="email" required />

      <label for="password">Password</label>
      <input id="password" type="password" minlength="8" required />
      <p class="hint">At least 8 characters.</p>

      <button class="btn primary" type="submit">Create account</button>
      <p class="form-error" id="error"></p>
    </form>
    <p class="u-11d6131e">Already have an account? <a id="login-link" href="/login.html" class="u-0b87e9e0">Sign in</a></p>
  </div>
</main>

<div id="site-footer"></div>

<script src="/js/dom.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/app.js"></script>
<script src="/js/pages/signup.js"></script>
</body>
</html>
