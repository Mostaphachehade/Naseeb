<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Giveaway — Naseeb</title>
<meta name="description" content="Enter this free giveaway on Naseeb — no purchase necessary, ever." />
<meta name="theme-color" content="#0B3B36" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/utilities.css" />
</head>
<body>
<a href="#main" class="skip-link" data-i18n="common.skipToContent">Skip to content</a>

<header class="site">
  <div class="wrap">
    <a href="/index.html" class="brand">Naseeb<span class="dot">.</span></a>
    <nav class="site-nav" id="site-nav"></nav>
  </div>
</header>

<section class="detail-hero">
  <div class="wrap">
    <span class="eyebrow mono" id="status-eyebrow"><span data-i18n="detail.loading">LOADING…</span></span>
    <h1 id="title" class="u-ad7e3130"><span data-i18n="detail.loading2">Loading…</span></h1>
    <p class="lede" id="hosted-by"></p>
  </div>
</section>

<main id="main">
  <div class="wrap">
    <div class="detail-grid">
      <div>
        <img class="detail-img" id="image" alt="" />
        <h3 class="u-f0778f9d" data-i18n="detail.aboutGiveaway">About this giveaway</h3>
        <p id="description" class="u-a2aae0fb"></p>
        <h3 class="u-3343fd64" data-i18n="detail.thePrize">The prize</h3>
        <p id="prize" class="u-a2aae0fb"></p>
      </div>

      <div>
        <div class="side-card">
          <div class="row"><span data-i18n="detail.status">Status</span><span id="row-status">—</span></div>
          <div class="row"><span data-i18n="detail.entriesSoFar">Entries so far</span><span id="row-entries">—</span></div>
          <div class="row"><span data-i18n="detail.estimatedValue">Estimated value</span><span id="row-value">—</span></div>
          <div class="row"><span data-i18n="detail.entryDeadline">Entry deadline</span><span id="row-deadline">—</span></div>
          <div class="row"><span data-i18n="detail.fundedBy">Funded by</span><span id="row-funded">—</span></div>

          <div id="winner-box" class="u-a0e7dd78 is-hidden">
            <strong data-i18n="detail.winnerLabel">Winner:</strong> <span id="winner-text"></span>
            <div id="delivery-status" class="u-b1ecc496"></div>
          </div>

          <button class="btn primary u-82da9eef" id="enter-btn" data-i18n="detail.enterFree">Enter for free</button>
          <button class="btn ghost u-8753b035 is-hidden" id="draw-btn" data-i18n="detail.drawWinner">Draw winner now</button>
          <!-- Fulfilment. Rendered from the claim's current state, so only the
               actions that are actually valid right now are shown, to the one
               person entitled to take them. Hidden entirely when the claim
               workflow is switched off — a dead button is worse than none. -->
          <div id="claim-panel" class="u-680b5a65 is-hidden">
            <div class="u-39a6b632">
              <strong id="claim-state-label"><span data-i18n="detail.prizeDelivery">Prize delivery</span></strong>
              <span class="pill-badge" id="claim-state-pill"></span>
            </div>
            <p class="hint u-2fd7789b" id="claim-state-help"></p>

            <!-- Delivery details, fetched only for the host and only after the
                 winner consented. Never written to localStorage, a URL, or an
                 analytics event. -->
            <div id="claim-delivery" class="u-1825864a is-hidden"></div>

            <div id="claim-actions" class="u-b7e103a1"></div>

            <div id="claim-dispute-box" class="u-674ae4aa is-hidden">
              <label for="claim-dispute-reason" class="u-6646d472"><span data-i18n="detail.whatWentWrong">What went wrong?</span></label>
              <textarea id="claim-dispute-reason" maxlength="500" placeholder="A short description — an administrator will read this."></textarea>
              <button class="btn ghost u-b1ecc496" id="claim-dispute-submit"><span data-i18n="detail.sendToReview">Send to review</span></button>
            </div>

            <p class="form-error" id="claim-error"></p>
          </div>
          <p class="js-mint-box is-hidden" id="entry-status"></p>
          <p class="form-error" id="action-error"></p>
          <p class="form-success" id="action-success"></p>
          <p class="hint u-88b9d5c6" data-i18n="detail.hint">No payment is ever requested to enter or to improve your odds. One entry per verified account.</p>
        </div>
      </div>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="/js/dom.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/app.js"></script>
<script src="/js/pages/giveaway.js"></script>
</body>
</html>
